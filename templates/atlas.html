<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TileAtlas · Sprite workshop</title><link rel="stylesheet" href="/static/atlas.css"></head><body>
<header><div><span class="mark">▦</span><b>TileAtlas</b><small>SPRITE WORKSHOP</small></div><nav><a href="/prepare">摄影素材准备</a><button id="demo">装载合成演示</button><button id="new">新建图集</button></nav></header>
<main><aside><h2>资产图集 <span id="count"></span></h2><div id="projects"></div><label class="upload">导入项目包<input id="import" type="file" accept=".zip"></label><p class="hint">为游戏UI、地图和像素精灵整理透明素材。每项目128张，单图最大4096像素，图集最大2048像素。</p></aside>
<section id="workspace"><div class="heading"><div><p class="eyebrow">ASSET PIPELINE / LOCAL WORKSPACE</p><h1 id="title">把散落素材变成可用图集</h1><p id="subtitle">裁掉透明边界，保留轴心，将素材打包为PNG与UV清单。</p></div><div id="exports"></div></div>
<div class="toolbar"><label class="upload">＋ 上传精灵<input id="upload" type="file" multiple accept="image/png,image/jpeg,image/webp"></label><button id="contact">联系表</button><button id="dupes">检查重复</button><label>边长<select id="size"><option>128</option><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select></label><label>间距<input id="padding" type="number" value="2" min="0" max="16"></label><label>外扩<input id="extrude" type="number" value="1" min="0" max="8"></label><label><input id="rotate" type="checkbox" checked>允许旋转</label><button class="primary" id="pack">生成图集</button></div>
<div id="notice" role="status"></div><div class="columns"><div><h2>精灵素材 <span id="spritecount"></span></h2><div id="sprites" class="sprites"><div class="empty">先装载合成演示，或建立项目并上传素材。</div></div></div><div class="preview"><div class="previewhead"><h2>图集预览</h2><label><input id="outlines" type="checkbox">矩形边界</label></div><img id="atlas" alt="图集预览" hidden><div id="stats" class="hint">生成后查看实际占用率及每张精灵的UV。</div><pre id="layout"></pre></div></div>
<div id="editor" hidden><h2 id="editname"></h2><div class="editgrid"><img id="spritepreview" alt="精灵预览"><div><label>名称<input id="name"></label><label><input id="enabled" type="checkbox">参与打包</label><label><input id="trim" type="checkbox">裁透明边</label><label>透明阈值<input id="threshold" type="number" min="0" max="254"></label><label>缩放<input id="scale" type="number" min=".05" max="8" step=".05"></label><label>顺时针转<select id="turn"><option value="0">0°</option><option value="1">90°</option><option value="2">180°</option><option value="3">270°</option></select></label><label><input id="flip_x" type="checkbox">水平镜像</label><label><input id="flip_y" type="checkbox">垂直镜像</label><label><input id="pixel_art" type="checkbox">像素画采样</label><label>轴心X<input id="pivotx" type="number" step=".05"></label><label>轴心Y<input id="pivoty" type="number" step=".05"></label><button id="save" class="primary">应用变换</button><button id="repeat">平铺预览</button><button id="inspect">边界与接缝报告</button><button id="delete">移除精灵</button></div></div><pre id="inspectresult"></pre>
<div id="seampanel"><h3>平铺接缝诊断</h3><div class="seamcontrols"><label>条带宽度<input id="seamstrip" type="number" min="1" max="64" value="8"></label><label>对齐候选<input id="seamcand" type="number" min="1" max="16" value="5"></label><label>尖峰标记<input id="seampeaks" type="number" min="1" max="32" value="8"></label><button id="seamanalyze" class="primary">分析接缝</button><button id="seamzip">导出诊断包</button></div><div id="seamresult"></div></div></div>
</section></main><script src="/static/atlas.js"></script></body></html>
