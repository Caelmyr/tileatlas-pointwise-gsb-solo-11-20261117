name: solo14-tileatlas
services:
  tileatlas:
    build: .
    image: solo14-tileatlas:1.0
    container_name: solo14-tileatlas
    ports:
      - "127.0.0.1:8914:8914"
    volumes:
      - tileatlas_data:/data
    environment:
      TILEATLAS_DATA_DIR: /data
      PORT: "8914"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:8914/atlas/health')"]
      interval: 15s
      timeout: 4s
      retries: 3
volumes:
  tileatlas_data:
